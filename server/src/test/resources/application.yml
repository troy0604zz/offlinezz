spring:
  datasource:
    url: jdbc:h2:mem:aibi_test;MODE=Oracle;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true

app:
  ai:
    mode: mock
    chat-provider: ollama
    embedding-provider: ollama
    ollama:
      base-url: http://127.0.0.1:11434
      chat-model: qwen3.5
      embedding-model: bge-m3
      timeout-seconds: 10
    qwen-api:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ""
      chat-model: qwen3.8-max
      embedding-model: qwen3.7-text-embedding
      embedding-dimensions: 1024
      timeout-seconds: 10
    qdrant:
      base-url: http://127.0.0.1:6333
      api-key: ""
      collection-prefix: test
      vector-size: 1024
  query:
    default-limit: 200
    max-limit: 1000
    timeout-seconds: 5
  storage:
    root: ./target/test-storage
