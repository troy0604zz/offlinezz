server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-bi-server
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mock}
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/aibi;MODE=Oracle;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

app:
  security:
    session-hours: ${AUTH_SESSION_HOURS:12}
    datasource-key: ${DATASOURCE_ENCRYPTION_KEY:}
  ai:
    mode: ${AI_MODE:mock}
    chat-provider: ${AI_CHAT_PROVIDER:ollama}
    embedding-provider: ${AI_EMBEDDING_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      chat-model: ${OLLAMA_CHAT_MODEL:qwen3.5:9b-q4_K_M}
      embedding-model: ${OLLAMA_EMBEDDING_MODEL:bge-m3:latest}
      context-length: ${OLLAMA_CONTEXT_LENGTH:8192}
      timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}
    qwen-api:
      base-url: ${QWEN_API_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:}
      chat-model: ${QWEN_API_CHAT_MODEL:qwen3.8-max}
      embedding-model: ${QWEN_API_EMBEDDING_MODEL:qwen3.7-text-embedding}
      embedding-dimensions: ${QWEN_API_EMBEDDING_DIMENSIONS:1024}
      timeout-seconds: ${QWEN_API_TIMEOUT_SECONDS:120}
    qdrant:
      base-url: ${QDRANT_BASE_URL:http://127.0.0.1:6333}
      api-key: ${QDRANT_API_KEY:}
      collection-prefix: ${QDRANT_COLLECTION_PREFIX:aibi}
      vector-size: ${QDRANT_VECTOR_SIZE:1024}
  query:
    default-limit: ${QUERY_DEFAULT_LIMIT:200}
    max-limit: ${QUERY_MAX_LIMIT:1000}
    timeout-seconds: ${QUERY_TIMEOUT_SECONDS:15}
  storage:
    root: ${STORAGE_ROOT:./data/storage}
