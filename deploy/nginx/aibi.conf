server {
    listen 80;
    server_name _;
    root /opt/aibi/web;
    index index.html;
    client_max_body_size 20m;

    location / { try_files $uri $uri/ /index.html; }
    location /api/ { proxy_pass http://127.0.0.1:8080; proxy_read_timeout 180s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /actuator/ { deny all; }
}
